app:
  env: prod
  debug: false

logger:
  level: info
  format: json
  output: stdout

database:
  postgres:
    host: prod-db
    port: 5432
    database: mmmo_affiliate_prod
    username: prod_user
    password: ''
    maxIdleConns: 20
    maxOpenConns: 200
    connMaxLifetime: 300

  redis:
    host: prod-redis
    port: 6379
    poolSize: 200
    minIdleConns: 20
    poolTimeout: 30

  elasticSearch:
    addresses:
      - http://prod-es:9200
    enableLogging: false
